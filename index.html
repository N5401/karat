<style>
/* =====================================================================
   KARAT — feuille de style (noir, bronze et or)
   Sobre : pas de halo, pas d'animation décorative, pas de fond animé.
   ===================================================================== */

:root{
  --bg:#070706; --bg2:#0c0b0a; --panel:#12110f; --raised:#1d1a16;
  --line:rgba(212,168,83,.14); --line2:rgba(212,168,83,.28); --line3:rgba(255,255,255,.06);
  --text:#f4eee3; --muted:#b9ae99; --dim:#7f7666;
  --gold:#d4a853; --gold2:#efcf88; --bronze:#a86f3b;
  --metal:linear-gradient(120deg,#9a6532 0%,#cf9d57 32%,#efcf88 52%,#c48d4c 74%,#8f5d2e 100%);
  --accent-ink:#0b0906;
  --ok:#9cc79a; --warn:#e2bd6b; --danger:#d98a7a;
  --r:14px; --r-sm:10px;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap-x{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--muted);font-size:14px}
.lead{color:var(--muted);font-size:17px;line-height:1.65}
.n{font-family:var(--mono);color:var(--gold)}
.ico{width:18px;height:18px;flex:0 0 18px;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-sm);font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent;transition:border-color .2s,color .2s,background-color .2s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-accent{background:var(--metal);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-line{border-color:var(--line2);color:var(--text);background:transparent}
.btn-line:hover{border-color:var(--gold);color:var(--gold2)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{color:var(--gold2);background:rgba(212,168,83,.06)}
.btn-danger{background:#b5624f;color:#fff}
.btn-danger:hover{background:#c97262}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:10px}
.linkbtn{color:var(--gold2);font-weight:600;font-size:13.5px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Badges, avatars, logo ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;background:var(--raised);color:var(--muted);border:1px solid var(--line3)}
.badge.accent{background:var(--gold);color:var(--accent-ink);border-color:transparent}
.badge.ok{color:var(--ok);background:rgba(156,199,154,.08);border-color:rgba(156,199,154,.22)}
.badge.warn{color:var(--warn);background:rgba(226,189,107,.08);border-color:var(--line2)}
.badge.danger{color:var(--danger);background:rgba(217,138,122,.08);border-color:rgba(217,138,122,.25)}
.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--raised);border:1px solid var(--line2);color:var(--gold2);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:28px;height:28px;flex-basis:28px;font-size:13px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.16em}

/* ---------- Cartes et grilles ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative}
.card.flat{background:var(--panel)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-h h3{font-size:17px;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:22px}
.kpi .k-l{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.kpi .k-v{font-family:var(--display);font-size:42px;font-weight:500;line-height:1.1;margin:8px 0 4px;color:var(--text)}
.kpi .k-s{font-size:12.5px;color:var(--dim)}
.delta{font-family:var(--mono);font-size:12px;color:var(--gold2);margin-left:8px}
.delta.neg{color:var(--danger)}

/* ---------- Champs ---------- */
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=number],input[type=url],input:not([type]),select,.input{width:100%;height:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:14px}
textarea{width:100%;min-height:96px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex:0 0 18px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.search{display:flex;align-items:center;gap:10px;min-width:260px;height:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--bg2);color:var(--dim)}
.search input{height:auto;border:0;background:transparent;padding:0;box-shadow:none}
.search input:focus{border:0}
.err{color:var(--danger);font-size:13.5px;min-height:18px}
.ok{color:var(--ok);font-size:13.5px}
.warn{padding:12px 14px;border-radius:var(--r-sm);background:rgba(226,189,107,.07);border:1px solid rgba(226,189,107,.25);color:var(--warn);font-size:13.5px}

/* ---------- Tableaux ---------- */
.table-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line3);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:rgba(212,168,83,.03)}
.who-cell{display:flex;align-items:center;gap:12px;min-width:0}
.who-cell b{font-weight:600;display:block}
.sort{display:inline-flex;align-items:center;gap:6px;color:inherit}
.sort:hover{color:var(--gold2)}
th.sort{display:table-cell;cursor:pointer}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages button{min-width:34px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.pages button:hover{border-color:var(--line2);color:var(--text)}
.pages button.on{background:var(--gold);color:var(--accent-ink);border-color:transparent}
.logs{display:grid;gap:0}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;align-items:center;gap:12px;margin:16px 0;font-size:14px}
.track{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.fill{height:100%;background:var(--metal);border-radius:99px}
.hbar .v{text-align:right;font-family:var(--mono);color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:8px;min-width:0}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--raised);min-height:3px}
.bars .b.hi i{background:var(--metal)}
.bars .b span{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Fenêtres, notifications, vide ---------- */
.veil{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.74);display:grid;place-items:center;padding:20px}
.sheet{width:min(580px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:28px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:10px}
.toast{background:var(--raised);border:1px solid var(--line2);color:var(--text);padding:12px 16px;border-radius:var(--r-sm);font-size:14px;max-width:360px}
.toast.bad{border-color:rgba(217,138,122,.5);color:#f1c7bf}
.dropveil{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;pointer-events:none}
.dropveil-card{border:1px dashed var(--gold);border-radius:var(--r);padding:44px;text-align:center;background:var(--panel)}
.dropveil-ico svg{width:44px;height:44px;color:var(--gold2)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:16px}
.empty .ico{width:40px;height:40px;margin:0 auto 14px;color:var(--gold)}
.empty .ico svg{width:100%;height:100%}

/* ---------- Pages publiques : barre, pied ---------- */
.lp,.lp-wrap,.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.lp{background:var(--bg);min-height:100vh;max-width:none;padding:0}
.lp-wrap,.wrap{width:100%}
.topbar{position:sticky;top:0;z-index:50;background:rgba(7,7,6,.95);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:70px}
.pubnav{display:flex;gap:28px}
.pubnav a{color:var(--muted);font-size:14px;transition:color .2s}
.pubnav a:hover,.pubnav a.on{color:var(--gold2)}
.topbar .row{gap:8px}
.lp-foot,footer{border-top:1px solid var(--line);padding:36px 0;color:var(--dim);font-size:13px}
.lp-foot .lp-wrap,.lp-foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.lp-foot nav{display:flex;gap:22px;flex-wrap:wrap}
.lp-foot nav a:hover{color:var(--gold2)}
.lp-foot .logo{font-size:16px}
.lp-sec{padding:96px 0;border-top:1px solid var(--line)}
.lp-sec-tight{padding:72px 0}
.lp-sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:46px}
.lp-sec-head p{max-width:420px;color:var(--muted)}
.lp-kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.lp-h2{font-family:var(--display);font-weight:500;font-size:48px;line-height:1.08;margin-top:12px}

/* ---------- Accueil ---------- */
.hm-hero{padding:88px 0 72px}
.hm-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.hm-eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hm-eyebrow i{width:30px;height:1px;background:var(--gold);display:inline-block}
.hm-h1{font-family:var(--display);font-weight:500;font-size:70px;line-height:1.02;letter-spacing:-.015em;margin:24px 0 22px}
.hm-h1 .acc{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.hm-lead{font-size:18px;color:var(--muted);max-width:560px;line-height:1.7}
.hm-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hm-note{margin-top:18px;font-size:13px;color:var(--dim)}
.hm-demo{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);overflow:hidden}
.hm-demo-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.hm-dots{display:flex;gap:6px}
.hm-dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line2)}
.hm-tabs{display:flex;gap:6px;flex-wrap:wrap}
.hm-tab{font-size:12.5px;padding:6px 10px;border-radius:7px;color:var(--muted);border:1px solid transparent}
.hm-tab:hover{color:var(--text)}
.hm-tab.on{color:var(--gold2);border-color:var(--line2)}
.hm-demo-body{padding:20px;min-height:300px;display:grid;align-content:start;gap:12px}
.hm-msg{max-width:88%;padding:12px 14px;border-radius:12px;background:var(--raised);font-size:14px;line-height:1.6}
.hm-msg.me{margin-left:auto;background:rgba(212,168,83,.12);border:1px solid var(--line2)}
.hm-code{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}
.hm-code code{font-family:var(--mono);font-size:12.5px;color:var(--gold2);white-space:pre}
.hm-typing{display:inline-flex;gap:5px}
.hm-typing i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hm-demo-input{display:flex;align-items:center;justify-content:space-between;margin:0 16px 14px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--dim);font-size:14px}
.hm-send{width:30px;height:30px;border-radius:8px;background:var(--metal);color:var(--accent-ink);display:grid;place-items:center}
.hm-send .ico{width:16px;height:16px}
.hm-caption{padding:0 16px 14px;font-size:12px;color:var(--dim)}
.hm-trust{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hm-trust>div{display:flex;align-items:center;gap:12px;padding:24px 18px;font-size:13.5px;color:var(--muted);border-left:1px solid var(--line)}
.hm-trust>div:first-child{border-left:0}
.hm-trust b{display:block;color:var(--text);font-weight:600;font-size:14px}
.hm-trust .ico{color:var(--gold);width:20px;height:20px;flex-basis:20px}
.hm-mods{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.hm-mod-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .2s}
.hm-mod-card:hover{border-color:var(--line2)}
.hm-mod-top{display:flex;justify-content:space-between;align-items:center}
.hm-ico{width:42px;height:42px;flex:0 0 42px;border-radius:11px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold)}
.hm-ico .ico{width:20px;height:20px}
.hm-num{font-family:var(--mono);font-size:12px;color:var(--dim)}
.hm-mod-card h3{font-size:19px;font-weight:600}
.hm-mod-card p{color:var(--muted);font-size:14.5px;line-height:1.6}
.hm-mod-card ul{list-style:none;display:grid;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line3)}
.hm-mod-card li{font-size:13.5px;color:var(--muted);padding-left:16px;position:relative}
.hm-mod-card li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1px;background:var(--gold)}
.hm-steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hm-step{padding:34px 30px;border-left:1px solid var(--line)}
.hm-step:first-child{border-left:0}
.hm-n{font-family:var(--display);font-size:46px;color:var(--gold);line-height:1}
.hm-step h3{margin:16px 0 8px;font-size:18px}
.hm-step p{color:var(--muted);font-size:14.5px}
.hm-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hm-feat{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:28px}
.hm-feat h3{font-size:17px;margin:18px 0 8px}
.hm-feat p{color:var(--muted);font-size:14.5px;line-height:1.65}
.hm-sec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.hm-sec-item{display:flex;gap:18px;align-items:flex-start;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.hm-sec-item .hm-ico{margin-top:2px}
.hm-sec-item h3{font-size:16.5px;margin-bottom:6px}
.hm-sec-item p{color:var(--muted);font-size:14.5px;line-height:1.65}
.upd-teaser{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.upd-mini{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:26px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.upd-mini:hover{border-color:var(--line2)}
.upd-mini .upd-date{font-family:var(--mono);font-size:12px;color:var(--dim)}
.upd-mini h3{font-size:17px}
.upd-mini p{color:var(--muted);font-size:14px;line-height:1.6}
.hm-final{border:1px solid var(--line2);border-radius:var(--r);padding:68px 40px;text-align:center;background:var(--panel)}
.hm-final h2{font-family:var(--display);font-weight:500;font-size:50px;line-height:1.08}
.hm-final p{color:var(--muted);margin:14px 0 30px}
.lp-faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start}
.lp-faq-side p{color:var(--muted);margin-top:14px}
.lp-faq-side a{color:var(--gold2)}
.lp-q{border-bottom:1px solid var(--line);padding:22px 0}
.lp-q summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.lp-q summary::-webkit-details-marker{display:none}
.lp-q summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1}
.lp-q[open] summary::after{content:"–"}
.lp-q p{color:var(--muted);margin-top:12px;font-size:14.5px;line-height:1.7}

/* ---------- Avis ---------- */
.avis-sec{margin:0}
.avis-rail{padding:6px 0 12px}
.avis-rail::-webkit-scrollbar{display:none}
.avis-loop{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.avis-track{display:flex;gap:16px;width:max-content;animation:avisScroll linear infinite}
.avis-set{display:flex;gap:16px}
.avis-loop:hover .avis-track{animation-play-state:paused}
.avis-static{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.avis-static .avis-card{width:auto;flex:none}
@keyframes avisScroll{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 8px))}}
.avis-card{flex:0 0 320px;width:320px;min-height:200px;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px}
.avis-text{color:var(--muted);font-size:14.5px;line-height:1.65;flex:1}
.avis-by{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.avis-by b{color:var(--muted);font-weight:600}
.avis-stars-ro{display:inline-flex;gap:2px}
.avis-stars-ro i{font-style:normal;color:#4a4236;font-size:16px}
.avis-stars-ro i.on{color:var(--gold)}
.avis-head-r,.avis-bilan{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avis-note{font-family:var(--display);font-size:44px;font-weight:500;line-height:1}
.avis-pick{display:flex;gap:6px}
.avis-pick-star{font-size:26px;color:#4a4236}
.avis-pick-star.on{color:var(--gold)}
.avis-empty{color:var(--dim);font-size:14px;padding:20px 0}
.avis-card-cta{margin-top:18px}
.avis-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}

/* ---------- Tarifs ---------- */
.section{padding:88px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:44px}
.head p{max-width:420px;color:var(--muted)}
.h-l{font-family:var(--display);font-weight:500;font-size:50px;line-height:1.08;letter-spacing:-.01em}
.h-section{font-family:var(--display);font-size:30px;font-weight:500;margin:34px 0 14px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.plan{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:34px 30px;display:flex;flex-direction:column;gap:10px}
.plan.hot{border-color:var(--gold);background:linear-gradient(180deg,#1b170f,var(--panel) 60%)}
.ribbon{position:absolute;top:-11px;left:30px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;background:var(--metal);color:var(--accent-ink);padding:4px 10px;border-radius:6px}
.pname{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.price{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price b{font-family:var(--display);font-weight:500;font-size:60px;line-height:1}
.price span{color:var(--dim);font-size:14px}
.plan .desc{color:var(--muted);font-size:14.5px;min-height:44px}
.plan ul{list-style:none;display:grid;gap:11px;margin:12px 0 22px;padding-top:20px;border-top:1px solid var(--line3)}
.plan li{display:flex;gap:10px;font-size:14px;color:var(--muted);align-items:flex-start}
.plan li .ico{color:var(--gold);width:16px;height:16px;flex-basis:16px;margin-top:3px}
.plan .btn{margin-top:auto}
.plan .status{font-size:13px;color:var(--gold2);min-height:20px;text-align:center;margin-top:8px}
.credit-offer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.credit-offer h3{font-size:17px}
.credit-offer p{color:var(--muted);font-size:14px;margin-top:4px}
.faq{border-bottom:1px solid var(--line);padding:20px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1}
.faq[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:12px;font-size:14.5px;line-height:1.7}

/* ---------- Mises à jour ---------- */
.upd-list{display:grid;max-width:880px;border-top:1px solid var(--line)}
.upd-item{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;padding:36px 0;border-bottom:1px solid var(--line)}
.upd-meta{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.upd-date{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.upd-body h3{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.2;margin-bottom:10px}
.upd-body p{color:var(--muted);line-height:1.7}
.upd-body ul{list-style:none;margin-top:16px;display:grid;gap:9px}
.upd-body li{position:relative;padding-left:22px;color:var(--text);font-size:14.5px;line-height:1.6}
.upd-body li::before{content:"";position:absolute;left:0;top:.75em;width:12px;height:1px;background:var(--gold)}
.upd-video{width:100%;max-width:340px;margin-top:20px;border-radius:var(--r-sm);border:1px solid var(--line2);background:#000;display:block}

/* ---------- Authentification ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:36px}
.auth-card h1,.auth-card h2{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.1}
.gslot{min-height:44px;margin-bottom:6px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11.5px;margin:18px 0;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:inline-flex;padding:4px;border:1px solid var(--line2);border-radius:11px;gap:4px;background:var(--bg2);max-width:100%;overflow-x:auto}
.seg button{height:34px;padding:0 14px;border-radius:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--gold);color:var(--accent-ink);font-weight:600}
.ack-list{display:grid;gap:10px}
.ack{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;color:var(--muted);cursor:pointer;line-height:1.55}
.ack:has(input:checked){border-color:var(--line2);color:var(--text)}
.ack input{margin-top:3px}

/* ---------- Coquille de l'espace connecté ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:2px}
.side>.logo{margin:0 10px 24px}
.side .group{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:20px 12px 8px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:14px;border:1px solid transparent;transition:color .2s,background-color .2s}
.nav-item:hover{color:var(--text);background:rgba(212,168,83,.05)}
.nav-item.on{color:var(--gold2);background:linear-gradient(90deg,rgba(212,168,83,.14),rgba(212,168,83,.03));border-color:var(--line2)}
.nav-item.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--metal)}
.nav-item .ico{width:18px;height:18px;color:var(--dim)}
.nav-item:hover .ico,.nav-item.on .ico{color:var(--gold)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--raised);padding:2px 7px;border-radius:6px}
.side .foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.plan-block{padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r-sm);background:linear-gradient(180deg,#171310,var(--panel));display:grid;gap:4px;margin-bottom:14px}
.plan-block b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.2}
.plan-block a{color:var(--gold2);font-size:13px}
.me-card{display:flex;align-items:center;gap:10px;min-width:0}
.me-card>div{min-width:0}
.me-card b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-card span{display:block;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:44px 48px 90px}
.main:has(.chat){padding:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:32px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.page-head h1{font-family:var(--display);font-weight:500;font-size:44px;line-height:1.05}
.page-head p{color:var(--muted);margin-top:8px}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.plan-status{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 24px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.danger-zone{border:1px solid rgba(217,138,122,.3);border-radius:var(--r);padding:22px 24px;background:rgba(217,138,122,.04)}
.danger-zone h3{color:#f1c7bf}

/* ---------- Chat ---------- */
.chat{height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.chat-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg2)}
.chat-top .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:30px 28px;display:flex;flex-direction:column;gap:24px}
.msg{display:flex;gap:12px;max-width:820px;width:100%;margin:0 auto;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .who{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;border:1px solid var(--line2);color:var(--gold2);background:var(--raised)}
.msg.me .who{background:var(--gold);color:var(--accent-ink);border-color:transparent}
.msg .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;line-height:1.7;max-width:calc(100% - 46px);font-size:15px;overflow-wrap:anywhere}
.msg.me .bubble{background:rgba(212,168,83,.1);border-color:var(--line2)}
.msg-meta{font-size:11.5px;color:var(--dim);margin-top:6px}
.msg-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg-imgs img{max-width:220px;border-radius:10px;border:1px solid var(--line)}
.bubble p+p{margin-top:10px}
.code-block{background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.code-block pre{padding:14px;overflow:auto}
.code-block code{font-family:var(--mono);font-size:13px;color:var(--text)}
.code-copy,.copy-btn{font-size:12px;color:var(--muted);padding:4px 9px;border-radius:6px;border:1px solid var(--line)}
.code-copy:hover,.copy-btn:hover{color:var(--gold2);border-color:var(--line2)}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5}
.welcome{max-width:880px;width:100%;margin:auto;display:grid;gap:30px;padding:8px 0 4px}
.wc-head{display:flex;gap:22px;align-items:flex-start}
.wc-mark{flex:0 0 60px;width:60px;height:60px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,#181410,var(--panel));display:grid;place-items:center}
.wc-mark svg{width:30px;height:30px}
.wc-text{min-width:0}
.wc-text .label{display:block;margin-bottom:12px}
.welcome h2{font-family:var(--display);font-weight:500;font-size:46px;line-height:1.05}
.welcome h2 em{font-style:italic;color:var(--gold2)}
.welcome .wc-desc{color:var(--muted);margin-top:12px;font-size:15.5px;line-height:1.65;max-width:600px}
.wc-caps{list-style:none;display:flex;flex-wrap:wrap;gap:10px 24px;padding-top:24px;border-top:1px solid var(--line)}
.wc-caps li{position:relative;padding-left:16px;font-size:13.5px;color:var(--muted)}
.wc-caps li::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--metal)}
.wc-sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.sugg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sugg-card{display:flex;flex-direction:column;gap:14px;min-height:132px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .2s,background-color .2s}
.sugg-card:hover{border-color:var(--gold);background:#161310}
.sugg-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sugg-card .n{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.sugg-t{flex:1;font-size:15px;line-height:1.45;color:var(--text)}
.sugg-arr{align-self:flex-end;width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sugg-card:hover .sugg-arr{transform:translateX(3px)}
.wc-tip{font-size:13px;color:var(--dim);line-height:1.6}
.composer{padding:14px 28px 18px;border-top:1px solid var(--line);background:var(--bg2)}
.inbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);padding:8px;max-width:820px;margin:0 auto}
.inbox textarea#input{flex:1;min-height:24px;max-height:200px;height:auto;border:0;background:transparent;resize:none;padding:10px 8px;box-shadow:none}
.attach-btn{color:var(--muted);flex:0 0 40px}
.attach-btn:hover{color:var(--gold2)}
.send{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--metal);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.4}
.hint{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);max-width:820px;margin:10px auto 0}
.chips-att{display:flex;flex-wrap:wrap;gap:8px;max-width:820px;margin:0 auto 10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px;color:var(--muted)}
.chip .ico{width:14px;height:14px;flex-basis:14px}
.chip button{color:var(--dim);display:grid;place-items:center}
.img-tray{display:flex;gap:8px;flex-wrap:wrap;max-width:820px;margin:0 auto 10px}
.img-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line2)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-thumb button{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;display:grid;place-items:center}
.usage-hint{color:var(--gold2);margin-right:8px}

/* ---------- Modules, historique, fichiers ---------- */
.mod{border:1px solid var(--line);border-radius:var(--r);padding:26px;background:var(--panel);display:flex;flex-direction:column;gap:18px;transition:border-color .2s,background-color .2s}
.mod:hover{border-color:var(--line2)}
.mod.is-on{border-color:var(--gold);background:linear-gradient(180deg,#181410,var(--panel) 55%)}
.mod-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mod .mi{width:48px;height:48px;flex:0 0 48px;border-radius:13px;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;color:var(--gold)}
.mod .mi .ico{width:22px;height:22px;flex-basis:22px}
.mod-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.mod-body h3{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1}
.mod-body p{color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:8px}
.mod-list{list-style:none;display:grid;gap:10px;padding:18px 0;border-top:1px solid var(--line3);border-bottom:1px solid var(--line3)}
.mod-list li{position:relative;padding-left:20px;font-size:14px;color:var(--text)}
.mod-list li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:1px;background:var(--gold)}
.mod .btn{margin-top:auto;width:100%}
.group-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px}
.conv{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
.conv>a,.conv>div{display:flex;gap:14px;align-items:center;min-width:0;width:100%;padding:14px 16px}
.conv:hover{border-color:var(--line2)}
.ci{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--gold)}
.ct{min-width:0;display:grid;gap:2px}
.ct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ct span{font-size:12.5px;color:var(--dim)}
.file{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
.fi{width:46px;height:46px;flex:0 0 46px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:var(--gold2)}
.drop{border:1px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel)}
.drop:hover,.drop:focus{border-color:var(--gold);outline:none}

/* ---------- Onboarding ---------- */
.ob-wrap{max-width:1000px;margin:0 auto;padding:60px 24px}
.ob-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:30px 0}
.ob-step{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--panel)}
.ob-step .n{font-family:var(--display);font-size:34px;color:var(--gold);display:block;line-height:1}
.ob-step h4{margin:12px 0 8px;font-size:16px}
.ob-step p{color:var(--muted);font-size:14px;line-height:1.6}

/* ---------- Documentation ---------- */
.kg{display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;align-items:start;max-width:1180px;margin:0 auto;padding:60px 24px}
.kg-toc{position:sticky;top:96px;display:grid;gap:4px}
.kg-toc-btn{text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.kg-toc-btn:hover,.kg-toc-btn.on{color:var(--gold2);background:rgba(212,168,83,.07)}
.kg-sec{padding-bottom:48px;margin-bottom:48px;border-bottom:1px solid var(--line)}
.kg-sec h2{font-family:var(--display);font-weight:500;font-size:40px;line-height:1.1;margin-bottom:16px}
.kg-sec p{color:var(--muted);line-height:1.75;margin-bottom:12px}
.kg-num{font-family:var(--mono);color:var(--gold);font-size:12px}
.kg-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.kg-step{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--panel)}
.kg-step .n{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.12em}
.kg-step h3{margin:10px 0 6px;font-size:16px}
.kg-step p{font-size:14px;margin:0}
.kg-qa{border-bottom:1px solid var(--line);padding:20px 0}
.kg-qa h3{font-size:16px;margin-bottom:6px}
.kg-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.kg-table{width:100%;border-collapse:collapse;font-size:14px}
.kg-table th,.kg-table td{padding:13px 16px;border-bottom:1px solid var(--line3);text-align:left;vertical-align:top}
.kg-table th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500}
.kg-cta{margin-top:22px;padding:28px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}

/* ---------- Administration ---------- */
.adm-kpi-note{margin-top:4px}
.count-pill{font-family:var(--mono);font-size:11px;color:var(--gold2)}

/* ---------- Réponsive ---------- */
@media (max-width:1100px){
  .hm-h1{font-size:60px}
  .hm-mods{grid-template-columns:repeat(2,1fr)}
  .hm-feats{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .main{padding:36px 32px 80px}
  .ob-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .hm-grid,.lp-faq{grid-template-columns:1fr;gap:40px}
  .hm-h1{font-size:50px}
  .hm-trust{grid-template-columns:repeat(2,1fr)}
  .hm-trust>div:nth-child(3){border-left:0}
  .hm-trust>div{border-top:1px solid var(--line)}
  .hm-steps{grid-template-columns:1fr}
  .hm-step{border-left:0;border-top:1px solid var(--line)}
  .hm-step:first-child{border-top:0}
  .hm-sec-grid,.upd-teaser{grid-template-columns:1fr}
  .plans{grid-template-columns:1fr;max-width:460px;margin:0 auto}
  .plan .desc{min-height:0}
  .lp-h2,.h-l{font-size:38px}
  .kg{grid-template-columns:1fr;gap:28px}
  .kg-toc{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
  .kg-steps{grid-template-columns:1fr}
  .shell{display:block}
  .side{position:relative;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:16px 14px}
  .side>.logo{margin:0 8px 14px}
  .side .foot{margin-top:14px}
  .main{padding:28px 20px 70px}
  .page-head h1{font-size:34px}
  .upd-item{grid-template-columns:1fr;gap:14px}
  .form-grid{grid-template-columns:1fr}
  .ob-grid{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .lp,.lp-wrap,.wrap{padding-left:16px;padding-right:16px}
  .topbar .wrap{height:auto;display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:10px;padding-top:12px;padding-bottom:12px}
  .topbar .wrap>.row{justify-self:end}
  .pubnav{grid-column:1 / -1;grid-row:2;width:100%;justify-content:flex-start;gap:16px;font-size:13px}
  .pubnav a{white-space:nowrap;font-size:13px}
  .online-pill{display:none}
  .topbar .row{gap:6px}
  .topbar .logo{font-size:18px;letter-spacing:.12em}
  .topbar .logo i{width:20px;height:20px;flex-basis:20px}
  .topbar .row .btn{height:32px;padding:0 10px;font-size:12px}
  .section{padding:60px 0}
  .lp-sec{padding:64px 0}
  .hm-hero{padding:52px 0 44px}
  .hm-h1{font-size:42px}
  .hm-lead{font-size:16.5px}
  .hm-ctas .btn{width:100%}
  .hm-trust{grid-template-columns:1fr}
  .hm-trust>div{border-left:0}
  .hm-mods,.hm-feats,.g2,.g3,.g4{grid-template-columns:1fr}
  .lp-h2{font-size:34px}
  .h-l{font-size:36px}
  .hm-final{padding:44px 22px}
  .hm-final h2{font-size:36px}

.lp-foot nav a{color:var(--muted)}

/* Panel : barre latérale */
.side{background:#0d0d0d;border-right:1px solid rgba(255,255,255,.08);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px}
.side-logo{font-size:30px;margin:2px 8px 22px;display:inline-block}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav-item{height:42px;padding:0 12px;border-radius:12px;color:var(--muted);font-size:15px;border:0;background:transparent;gap:12px}
.nav-item:hover{background:#161616;color:var(--text);border:0}
.nav-item.on{background:#1b1b1b;color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);border:0}
.nav-item.on::before{display:none}
.nav-item .ico,.nav-item:hover .ico,.nav-item.on .ico{color:inherit}
.side .group-btn{color:var(--dim)}
.side .group-btn:hover{color:var(--text)}
.side-label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:24px 12px 8px;margin:0;font-weight:500}
.side-recent{display:flex;flex-direction:column;gap:2px}
.recent{display:block;height:36px;line-height:36px;padding:0 12px;border-radius:10px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6;margin-right:10px;vertical-align:middle}
.recent:hover{background:#161616;color:var(--text)}
.recent.on{background:#1b1b1b;color:var(--text)}
.recent-empty{font-size:13px;color:var(--dim);padding:0 12px;margin:0}
.nav-out{color:var(--muted)}
.acct{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:#131313}
.acct:hover{border-color:rgba(255,255,255,.25)}
.acct-av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:#1b1b1b;border:1px solid rgba(255,255,255,.16);color:var(--text);font-size:13px;font-weight:600}
.acct-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.acct-txt b{font-size:14px;font-weight:500;color:var(--text)}
.acct-txt small{font-size:12px;color:var(--muted)}

/* Conversation */
.chat{background:#070707}
.chat-top{height:64px;padding:0 24px 0 20px;background:#070707;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.chat-title{display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;color:var(--text)}
.chat-title .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-chev{width:14px;height:14px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot-live{width:6px;height:6px;border-radius:50%;background:#f4f4f1;flex:none}
.back-btn{display:none}
.chat-acts{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:#161616;color:var(--text)}
.msgs{background:#070707;padding:32px 24px 8px;gap:30px}
.msg{max-width:760px;gap:16px}
.msg.ai .bubble{font-size:15px;line-height:1.7}
.msg.me .bubble{background:#1b1b1b;border:0;border-radius:22px 22px 6px 22px;padding:12px 18px;font-size:15px;line-height:1.55}
.copy-btn{width:30px;height:30px;padding:0;border-radius:8px;justify-content:center;color:var(--dim)}
.copy-btn:hover{color:var(--text);background:#161616}
.copy-btn .copy-label{display:none}
.msg-meta{color:var(--dim)}
.typing i{background:#f4f4f1}

/* Accueil du chat (vide) */
.welcome.kh-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;max-width:760px;width:100%;margin:auto;padding:24px 0 40px;text-align:center}
.kh-w-divider{display:flex;align-items:center;gap:12px}
.kh-w-divider span{width:56px;height:1px;background:linear-gradient(90deg,transparent,#f4f4f1)}
.kh-w-divider span:last-child{background:linear-gradient(270deg,transparent,#f4f4f1)}
.kh-w-divider i{width:7px;height:7px;background:#a8a8a4;transform:rotate(45deg)}
.kh-w-label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);margin:0}
.kh-welcome h2{font-family:var(--display);font-size:60px;font-weight:500;line-height:1.05;margin:-12px 0 0;color:var(--text)}
.kh-welcome h2 em{font-style:italic;color:var(--muted);padding-right:.06em}
.kh-welcome .composer{width:min(720px,100%);padding:0;background:none;border:0;max-width:none}
.kh-welcome .composer .inbox{max-width:none;width:100%}
.kh-welcome .composer .hint{display:none}
.kh-w-sec{width:min(720px,100%);display:flex;flex-direction:column;gap:2px;text-align:left}
.kh-w-sub{padding:0 14px 6px;color:var(--muted)}
.kh-w-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.kh-w-item{height:46px;padding:0 14px;border-radius:12px;color:var(--muted);font-size:15px;gap:14px;background:transparent;border:0}
.kh-w-item:hover,.kh-w-item:focus-visible{background:#131313;color:var(--text)}
.kh-w-item::after{content:"→";margin-left:auto;padding-right:4px;color:var(--text);opacity:0;transition:opacity .15s}
.kh-w-item:hover::after{opacity:1}
.kh-w-item .ico svg{width:18px;height:18px;color:inherit}

/* Zone de saisie */
.composer{background:#070707;border-top:0;padding:10px 24px 14px;flex:none}
.composer .inbox{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:34px;background:#131313;border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 40px -24px rgba(0,0,0,.9)}
.inbox:focus-within{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.inbox textarea#input{font-size:16px;color:var(--text);padding:8px 6px;min-height:40px}
.attach-btn{width:42px;height:42px;border-radius:50%;background:#1b1b1b;border:0;color:var(--text);flex:none}
.attach-btn:hover{background:#242424}
.tools-wrap{position:relative;flex:none}
.tools-btn{height:36px;padding:0 12px;border-radius:18px;border:0;background:transparent;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tools-btn:hover{color:var(--text)}
.tools-pop{position:absolute;right:0;bottom:calc(100% + 12px);min-width:200px;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:14px;background:#1b1b1b;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 48px -20px rgba(0,0,0,.95);z-index:20}
.tools-pop[hidden]{display:none}
.tools-pop button{height:40px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:14px;text-align:left}
.tools-pop button:hover{background:#242424;color:var(--text)}
.tools-pop button.on{color:var(--text);background:#131313}
.send{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:#a86f3b;color:#0b0b0b}
.send svg{width:18px;height:18px;stroke:#0b0b0b}
.hint{justify-content:center;text-align:center;max-width:none;margin:10px 0 0;font-size:12px;color:var(--dim)}
.hint .usage-hint:empty{display:none}

/* Téléphone */
@media (max-width:900px){
  .app-top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 8px;background:#0d0d0d;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:40}
  .app-top .logo{position:absolute;left:50%;transform:translateX(-50%);font-size:24px}
  .app-top-new{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
  .shell:has(.chat.is-conv) .app-top{display:none}
  .chat-top{height:60px;padding:0 8px}
  .back-btn{display:grid;width:44px;height:44px}
  .chat-title{flex:1;min-width:0;justify-content:center;padding:0 6px}
  .chat-title .title{font-size:15px}
  .dot-live{display:none}
  .share-btn{display:none}
  .chat-acts{width:44px;justify-content:flex-end}
  .msgs{padding:20px 16px 8px;gap:22px}
  .composer{padding:10px 12px 14px}
  .composer .inbox{padding:7px;gap:6px;border-radius:30px}
  .attach-btn{width:38px;height:38px}
  .send{width:38px;height:38px;flex-basis:38px}
  .tools-btn span{display:none}
  .tools-btn{padding:0 8px}
  .hint{font-size:10.5px}
  .kh-welcome h2{font-size:42px}
  .kh-top .wrap{padding:0 16px}
  .kh-link{display:none}
  .kh-h1{font-size:62px}
}
@media (max-width:600px){
  .kh-w-sub{display:none}
  .kh-w-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .kh-w-item{flex-direction:column;align-items:flex-start;justify-content:flex-start;height:auto;min-height:110px;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:#131313;color:var(--text);font-size:15px;font-weight:500;gap:14px;line-height:1.3;text-align:left}
  .kh-w-item::after{display:none}
  .kh-w-item .ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);display:grid;place-items:center}
  .kh-welcome{gap:26px;padding-top:8px}
  .kh-w-divider span{width:40px}
  .kh-h1{font-size:50px}
  .kh-ctas{flex-direction:column;align-items:stretch}
  .kh-ctas .btn{justify-content:center}
}

/* Corrections après relecture des captures */
.icon-btn.back-btn{display:none}
.kh-w-item .ico{flex:0 0 36px}
@media (max-width:900px){
  .icon-btn.back-btn{display:grid}
  .chat:not(.is-conv) .chat-top{display:none}
  .kh-hero-grid{grid-template-columns:1fr;gap:48px}
  .kh-visual{padding:12px 0 36px}
  .kh-visual::before{inset:-30px -10px -40px -10px}
  .kh-clip{right:6px}
  .lp{overflow-x:hidden}
}
@media (max-width:600px){
  .kh-w-item .ico{flex:0 0 36px;width:36px;height:36px}
  .kh-w-item .ico svg{width:18px;height:18px}
}

/* ---------- Mot de passe : PBKDF2 (jamais stocké en clair) ---------- */
const b64   = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pw, saltB64){
  if (!window.crypto || !crypto.subtle) throw new Error("NO_CRYPTO");
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key  = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 210000, hash: "SHA-256" }, key, 256);
  return { hash: b64(new Uint8Array(bits)), salt: b64(salt) };
}
async function verifyPw(pw, u){ return (await hashPw(pw, u.salt)).hash === u.hash; }

function currentRoute(){
  const raw = location.hash.replace(/^#/, "") || "/";
  const i = raw.indexOf("?");
  return { path: i < 0 ? raw : raw.slice(0, i), q: new URLSearchParams(i < 0 ? "" : raw.slice(i + 1)) };
}
function go(path){
  if (location.hash === "#" + path) render();
  else location.hash = path;
}
window.addEventListener("hashchange", render);

function render(){
  const { path, q } = currentRoute();
  if (path === "/app/compte") return go("/app/offre");
  if (path === "/app/fichiers") return go("/app/chat");
  const route = ROUTES.find(r => r.re.test(path));
  if (!route) return go("/");
  const admin = isAdmin(session?.email);

  if (route.admin){
    if (!session) return go("/connexion?next=" + enc(path));
    if (!admin){ toast("Accès réservé à l'administrateur", true); return go("/app/chat"); }
  }
  if (route.app || route.onboard){
    if (!session) return go("/connexion?next=" + enc(path));
    if (!hasAccess()){ toast("Choisissez une offre pour ouvrir le panel", true); return go("/tarifs"); }
  }
  if (route.onboard) return go("/app/chat");
  if (path === "/connexion" && session) return go(q.get("next") || "/app/chat");

  const m = path.match(route.re);
  $("#app").innerHTML = route.fn(m, q);
  afterRender(path);
}

function hmRender(mod, instant){
  const box = document.getElementById("hm-body");
  if (!box) return;
  const run = ++hmRun;
  clearTimeout(hmTimer);
  document.querySelectorAll(".hm-tab").forEach(b => b.classList.toggle("on", b.dataset.hmMod === mod));
  const items = HM_DEMO[mod];
  if (instant){ box.innerHTML = items.map(hmMsg).join(""); box.scrollTop = box.scrollHeight; return; }
  box.innerHTML = "";
  let t = 350;
  items.forEach(it => {
    if (it.me){
      setTimeout(() => { if (run === hmRun) box.insertAdjacentHTML("beforeend", hmMsg(it)); }, t);
      t += 800;
    } else {
      setTimeout(() => {
        if (run !== hmRun) return;
        box.insertAdjacentHTML("beforeend", `<div class="hm-msg hm-typing"><i></i><i></i><i></i></div>`);
        box.scrollTop = box.scrollHeight;
      }, t);
      setTimeout(() => {
        if (run !== hmRun) return;
        const dots = box.querySelector(".hm-typing");
        if (dots) dots.remove();
        box.insertAdjacentHTML("beforeend", hmMsg(it));
        box.scrollTop = box.scrollHeight;
      }, t + 1100);
      t += 1700;
    }
  });
  if (hmAuto){
    hmTimer = setTimeout(() => {
      if (run !== hmRun || !hmAuto) return;
      hmRender(HM_ORDER[(HM_ORDER.indexOf(mod) + 1) % HM_ORDER.length], false);
    }, t + 4500);
  }
}

function startHome(){
  const box = document.getElementById("hm-body");
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  hmAuto = !reduce;
  if (box) hmRender("general", reduce);
  document.querySelectorAll(".hm-tab").forEach(b => b.addEventListener("click", () => {
    hmAuto = false;
    hmRender(b.dataset.hmMod, false);
  }));
  document.querySelectorAll(".hm-use[data-hm-mod]").forEach(c => c.addEventListener("click", () => {
    hmAuto = false;
    hmRender(c.dataset.hmMod, false);
    document.querySelector(".hm-hero")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  document.querySelectorAll(".hm-use[data-hm-mod]").forEach(c => c.addEventListener("keydown", e => { if (e.key === "Enter") c.click(); }));
  document.querySelectorAll(".hm-mod-card").forEach(c => c.addEventListener("click", () => {
    hmAuto = false;
    hmRender(c.dataset.hmMod, false);
    document.querySelector(".hm-hero")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  if ("IntersectionObserver" in window){
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting){ e.target.classList.add("hm-in"); io.unobserve(e.target); }
    }), { threshold: .12 });
    document.querySelectorAll(".hm-rv").forEach(el => io.observe(el));
  } else {
    document.querySelectorAll(".hm-rv").forEach(el => el.classList.add("hm-in"));
  }
}

const googleOn = () => !!CONFIG.GOOGLE_CLIENT_ID && !CONFIG.GOOGLE_CLIENT_ID.startsWith("REMPLACER");
const setErr = m => { const el = $("#authErr"); if (el) el.textContent = m || ""; };
const nextTarget = () => currentRoute().q.get("next") || "/app/chat";

function startSession(s, isNew){
  session = { ...s, exp: Date.now() + 7 * 24 * 3600 * 1000 };
  store.set("karat_session", session);
  logEvent(isNew ? "inscription" : "connexion", s.email, s.provider || "mot de passe");
  go(isNew ? "/app/guide" : nextTarget());
  toast(`Bienvenue, ${s.name || s.email}`);
}
// Envoie le compte au serveur, pour que l'administrateur voie tous les comptes (une fiche par adresse, sans mot de passe)
function sendAccount(u){
  const body = JSON.stringify({ email: u.email, firstName: u.firstName || "", lastName: u.lastName || "", phone: u.phone || "", provider: u.provider || "", createdAt: u.createdAt || Date.now(), lastLogin: u.lastLogin || Date.now() });
  // Une nouvelle tentative après 3 s si l'envoi échoue (réseau momentanément coupé)
  const send = (left) => fetch("/.netlify/functions/inscriptions", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); })
    .catch(() => { if (left > 0) setTimeout(() => send(left - 1), 3000); });
  try { send(1); } catch (e) {}
}
async function onLogin(f){
  setErr("");
  const email = emailOf(f.querySelector('[name="email"]').value);
  const pw = f.querySelector('[name="pw"]').value;
  const u = users[email];
  if (!u) return setErr("Aucun compte avec cet e-mail. Créez-le d'abord.");
  if (!u.hash) return setErr("Ce compte utilise Google. Utilisez le bouton Google.");
  try{
    if (!(await verifyPw(pw, u))) return setErr("Mot de passe incorrect.");
  }catch(e){ return setErr("Votre navigateur bloque le chiffrement. Ouvrez la page en https ou en local."); }
  u.lastLogin = Date.now(); saveUsers();
  sendAccount(users[email]);
  startSession({ email, name: displayName(u) }, false);
}
async function onSignup(f){
  setErr("");
  const v = n => f.querySelector(`[name="${n}"]`).value.trim();
  const first = v("first"), last = v("last"), email = emailOf(v("email")), phone = v("phone");
  const pw = f.querySelector('[name="pw"]').value, pw2 = f.querySelector('[name="pw2"]').value;
  if (!first || !last) return setErr("Renseignez votre prénom et votre nom.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setErr("Adresse e-mail invalide.");
  if (!/^\+?[0-9 .\-()]{8,20}$/.test(phone)) return setErr("Numéro de téléphone invalide.");
  if (pw.length < 8) return setErr("Le mot de passe doit faire au moins 8 caractères.");
  if (pw !== pw2) return setErr("Les deux mots de passe ne correspondent pas.");
  if (!f.querySelector('[name="cgu"]').checked) return setErr("Acceptez les CGU pour continuer.");
  if (users[email]) return setErr("Un compte existe déjà avec cet e-mail. Connectez-vous.");
  try{
    const { hash, salt } = await hashPw(pw);
    users[email] = { email, firstName: first, lastName: last, phone, hash, salt, provider: "password", createdAt: Date.now(), lastLogin: Date.now() };
    saveUsers();
  }catch(e){ return setErr("Votre navigateur bloque le chiffrement. Ouvrez la page en https ou en local."); }
  sendAccount(users[email]);
  startSession({ email, name: `${first} ${last}` }, true);
}
function parseJwt(token){
  const b = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(decodeURIComponent(atob(b).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
}
window.handleGoogleCredential = function(resp){
  try{
    const p = parseJwt(resp.credential);
    const email = emailOf(p.email);
    const isNew = !users[email];
    const old = users[email] || {};
    users[email] = {
      ...old, email,
      firstName: old.firstName || p.given_name || "",
      lastName:  old.lastName  || p.family_name || "",
      provider:  old.provider  || "google",
      createdAt: old.createdAt || Date.now(),
      lastLogin: Date.now(), picture: p.picture
    };
    saveUsers();
    sendAccount(users[email]);
    startSession({ email, name: p.name, picture: p.picture, provider: "Google" }, isNew);
  }catch(e){ setErr("Connexion Google impossible, réessayez."); }
};
function initGoogle(){
  if (!googleOn()) return;
  let tries = 0;
  const tryRender = () => {
    const slot = $("#gbtnWrap");
    if (!slot) return;
    if (window.google && google.accounts && google.accounts.id){
      google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: window.handleGoogleCredential, auto_select: false });
      slot.innerHTML = "";
      google.accounts.id.renderButton(slot, { theme: "filled_black", size: "large", shape: "pill", text: "continue_with", width: 300 });
    } else if (tries++ < 25) setTimeout(tryRender, 300);
  };
  tryRender();
}
function doLogout(){
  try{ if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  if (session) logEvent("déconnexion", session.email);
  session = null; store.del("karat_session");
  ui.convId = null; ui.attached = []; ui.typing = false;
  toast("Vous êtes déconnecté");
  go("/");
}

function startPlan(plan, period = "mois"){
  if (!session) return go("/connexion?next=" + enc("/tarifs"));
  if (isAdmin(session.email)){ toast("Compte administrateur : accès complet inclus"); return go("/app/chat"); }
  if (planOf(session.email) === plan) return go("/app/chat");
  const links = period === "an" ? CONFIG.PAYMENT_LINKS_YEAR : CONFIG.PAYMENT_LINKS;
  const link = links[plan];
  if (period === "an" && !link){ toast("L'offre annuelle arrive très bientôt", true); return; }
  if (link){
    const url = new URL(link);
    url.searchParams.set("prefilled_email", session.email);
    window.location.href = url.toString();
    return;
  }
  // mode test : aucun lien de paiement configuré
  subs[emailOf(session.email)] = { plan, since: Date.now(), ack: false };
  saveSubs();
  logEvent("abonnement", session.email, PLANS[plan].name + " (test)");
  toast("Offre " + PLANS[plan].name + " activée (test)");
  go("/app/chat");
}
async function syncPlan(){
  if (!session || !CONFIG.VERIFY_ENDPOINT) return false;
  try{
    const r = await fetch(CONFIG.VERIFY_ENDPOINT + "?email=" + enc(session.email), { cache: "no-store" });
    const j = await r.json();
    const k = emailOf(session.email);
    const prev = subs[k];
    if (!j.plan || !PLANS[j.plan]){
      // accès retiré côté serveur : on retire l'offre synchronisée (les offres de test restent)
      if (prev && prev.src === "server"){ delete subs[k]; saveSubs(); logEvent("accès", session.email, "retiré"); }
      return false;
    }
    if (!prev || prev.plan !== j.plan || prev.src !== "server"){
      subs[k] = { plan: j.plan, since: prev && prev.plan === j.plan ? prev.since : Date.now(), ack: prev ? !!prev.ack : false, src: "server" };
      saveSubs();
      logEvent("abonnement", session.email, PLANS[j.plan].name + (j.source === "offert" ? " (offert)" : " (Stripe)"));
    }
    return true;
  }catch(e){ return false; }
}
async function verifyPayment(plan){
  const ok = await syncPlan();
  if (ok){ toast("Offre " + PLANS[plan].name + " activée"); go("/app/chat"); }
  else toast("Paiement en cours de confirmation, réessayez dans une minute", true);
}
(function handleReturn(){
  const paid = new URLSearchParams(location.search).get("paid");
  if (!paid || !PLANS[paid]) return;
  history.replaceState(null, "", location.pathname + location.hash);
  if (session) verifyPayment(paid);
  else toast("Paiement reçu. Connectez-vous pour activer votre offre.");
})();

// Mise en forme du texte : paragraphes, listes à puces (- ou *) et listes numérotées (1.)
function mdInline(s){
  return s.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function mdText(s){
  return esc(s.trim()).split(/\n{2,}/).filter(Boolean).map(block => {
    const out = [];
    let buf = [], list = null;
    const flushP = () => { if (buf.length){ out.push(`<p>${buf.map(mdInline).join("<br>")}</p>`); buf = []; } };
    const flushL = () => { if (list){ out.push(`<${list.tag}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
    block.split("\n").forEach(ln => {
      const bul = ln.match(/^\s*[-*•]\s+(.*)$/), num = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bul || num){
        const tag = bul ? "ul" : "ol";
        flushP();
        if (!list || list.tag !== tag){ flushL(); list = { tag, items: [] }; }
        list.items.push((bul || num)[1]);
      } else {
        flushL();
        buf.push(ln);
      }
    });
    flushP(); flushL();
    return out.join("");
  }).join("");
}
function renderMd(text){
  const parts = String(text ?? "").split("```");
  return parts.map((part, i) => {
    if (i % 2 === 0) return mdText(part);
    const nl = part.indexOf("\n");
    const info = (nl < 0 ? part : part.slice(0, nl)).trim();
    const code = (nl < 0 ? "" : part.slice(nl + 1)).replace(/\n$/, "");
    const [lang = "", file = ""] = info.split(/\s+/);
    const label = file || lang || "code";
    return `<div class="code-block"><div class="code-h"><span>${esc(label)}</span>
      <button type="button" class="code-copy" data-action="copy-code" data-code="${esc(code)}">${ic("copy")} Copier</button></div>
      <pre><code>${esc(code)}</code></pre></div>`;
  }).join("");
}

    const pics = m.thumbs && m.thumbs.length ? `<div class="msg-imgs">${m.thumbs.map(t => `<img src="${t}" alt="Image jointe">`).join("")}</div>` : "";
    return `<div class="msg me"><div class="who">${esc(initial(displayName(me()) || session.email))}</div>
      <div><div class="bubble">${pics}${att}${esc(m.text)}</div><div class="msg-meta" style="justify-content:flex-end">${t}</div></div></div>`;
  }
  return `<div class="msg ai">${AI_AVATAR}
    <div><div class="bubble">${renderMd(m.text)}</div>
    <div class="msg-meta"><span>${t}</span><button class="btn btn-ghost btn-sm copy-btn" data-action="copy" data-text="${esc(m.text)}" aria-label="Copier la réponse" title="Copier">${ic("copy")}<span class="copy-label"> Copier</span></button></div></div></div>`;
}

// Attend la réponse d'une génération en arrière-plan (interrogation toutes les 2 secondes)
async function pollAI(id){
  const t0 = Date.now();
  while (Date.now() - t0 < 10 * 60 * 1000){
    await new Promise(r => setTimeout(r, 2000));
    let d = null;
    try { d = await (await fetch(CONFIG.AI_RESULT + "?id=" + enc(id), { cache: "no-store" })).json(); } catch (e) { d = null; }
    if (!d) continue;
    if (d.status === "done"){
      const txt = String(d.reply || "").trim() || "Je ne peux pas répondre à cette demande. Précisez votre besoin et je vous aide.";
      return txt + (d.stopped ? "\n\n[Réponse coupée : demandez « continue » pour la suite.]" : "");
    }
    if (d.status === "error") throw new Error(d.error || "Erreur IA");
  }
  throw new Error("Délai dépassé");
}
async function askAI(conv, ctx, images, pdfs, names, id){
  const history = conv.messages.map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
  if (ctx && history.length) history[history.length - 1].content = ctx + "\n\n" + history[history.length - 1].content;
  if (CONFIG.AI_ENDPOINT){
    const r = await fetch(CONFIG.AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, email: session ? session.email : "", mode: conv.mode, messages: history, images: images || [], pdfs: pdfs || [], imageNames: (names && names.images) || [], pdfNames: (names && names.pdfs) || [] }) });
    if (!r.ok && r.status !== 202) throw new Error("Envoi impossible");
    return pollAI(id);
  }
  await new Promise(r => setTimeout(r, 900 + Math.random() * 800));
  const last = conv.messages[conv.messages.length - 1].text;
  const extra = ctx ? "\n\nLes fichiers joints ont bien été lus." : "";
  return `[Démo · ${MODES[conv.mode].name}] ${MODES[conv.mode].desc}\n\nVotre message : « ${last.slice(0, 160)}${last.length > 160 ? "…" : ""} »${extra}\n\nBranchez AI_ENDPOINT dans la configuration pour activer la vraie IA.`;
}
async function sendMessage(override){
  if (ui.typing) return;
  const input = $("#input");
  const typed = (override ?? (input ? input.value : "")).trim();
  const imgs = (ui.pendingImg || []).slice();
  const docs = (ui.pendingFiles || []).slice();
  if (!typed && !imgs.length && !docs.length) return;
  if (!hasAccess()) return go("/tarifs");
  const text = typed || "Analyse chaque fichier joint et dis-moi l'essentiel de chacun.";

  // Contexte texte : 30 000 caractères par fichier, 150 000 au total
  let budget = 150000;
  const ctxParts = [];
  for (const f of docs.filter(f => f.content != null)){
    if (budget <= 0) break;
    const piece = f.content.slice(0, Math.min(30000, budget));
    budget -= piece.length;
    ctxParts.push(`Fichier « ${f.name} » :\n${piece}`);
  }
  const ctx = ctxParts.join("\n\n");
  const pdfDocs = docs.filter(f => f.pdf);
  const pdfs = pdfDocs.map(f => f.pdf);
  const imgNames = imgs.map(i => i.name);
  const pdfNames = pdfDocs.map(f => f.name);

  // Taille totale envoyée au serveur (limite Netlify ≈ 6 Mo) : on prévient avant d'envoyer
  const payload = imgs.reduce((n, i) => n + i.data.length, 0) + pdfs.reduce((n, d) => n + d.length, 0) + ctx.length;
  if (payload > 5000000){ toast("Trop de contenu dans ce message : retirez quelques fichiers", true); return; }
  let conv = ui.convId ? convById(ui.convId) : null;
  if (!conv){
    conv = { id: uid(), title: text.slice(0, 48), mode: ui.mode, createdAt: Date.now(), messages: [] };
    myChats().unshift(conv);
    ui.convId = conv.id;
  }

  conv.messages.push({ role: "user", text, files: docs.map(f => f.name), thumbs: imgs.map(i => i.thumb), at: Date.now() });
  conv.updatedAt = Date.now();
  ui.attached = [];
  ui.pendingImg = [];
  ui.pendingFiles = [];
  ui.typing = true;
  saveChats();
  go(`/app/chat/${conv.id}`);
  if (location.hash === "#/app/chat/" + conv.id) render();

  const reqId = uid() + uid();
  store.set("karat_ai_pending", { id: reqId, conv: conv.id });
  let reply;
  try{ reply = await askAI(conv, ctx, imgs.map(i => i.data), pdfs, { images: imgNames, pdfs: pdfNames }, reqId); }
  catch(e){ reply = "La réponse n'a pas pu être générée (" + (e.message || "erreur") + "). Réessayez."; }
  store.del("karat_ai_pending");
  conv.messages.push({ role: "ai", text: reply, at: Date.now() });
  conv.updatedAt = Date.now();
  ui.typing = false;
  saveChats();
  render();
}

function dayBucket(t){
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const diff = Math.round((now - d) / 864e5);
  if (diff <= 0) return "Aujourd'hui";
  if (diff === 1) return "Hier";
  if (diff <= 7) return "Cette semaine";
  if (diff <= 30) return "Ce mois-ci";
  return "Plus ancien";
}
function vHistory(){
  const list = [...myChats()].sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
  const groups = {};
  list.forEach(c => { const k = dayBucket(c.updatedAt || c.createdAt); (groups[k] = groups[k] || []).push(c); });
  const body = Object.keys(groups).map(g => `

function isTextLike(file){
  return file.type.startsWith("text/") || file.type === "application/json" ||
    /\.(md|txt|csv|json|js|ts|py|html|css|xml|yaml|yml|sql|log)$/i.test(file.name);
}
const readText = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
async function importFiles(list){
  let added = 0;
  for (const file of list){
    if (file.size > 2 * 1024 * 1024){ toast(`« ${file.name} » dépasse 2 Mo`, true); continue; }
    let content = null;
    if (isTextLike(file) && file.size <= 300 * 1024){
      try{ content = await readText(file); }catch(e){}
    }
    myFiles().push({ id: uid(), name: file.name, size: file.size, type: file.type, content, createdAt: Date.now() });
    added++;
  }
  if (added){ saveFiles(); toast(`${added} fichier${added > 1 ? "s" : ""} ajouté${added > 1 ? "s" : ""}`); render(); }
}

// Offre effective d'un compte : accès offert par l'administrateur, sinon abonnement Stripe
function effPlan(email){
  const k = emailOf(email);
  if (!accesLoaded()) return (subs[k] || {}).plan || null;
  const ov = (accesCache || {})[k];
  if (ov && PLANS[ov.plan]) return ov.plan;
  const st = (stripeCache || []).find(x => x.email === k);
  return st ? st.plan : null;
}

// Une ligne par compte : payant (Stripe) et/ou accès offert
function stripeRows(){
  const acc = accesCache || {};
  const byEmail = {};
  (stripeCache || []).forEach(x => { byEmail[x.email] = x; });
  return [...new Set([...Object.keys(byEmail), ...Object.keys(acc)])].map(email => {
    const st = byEmail[email] || {};
    const ov = acc[email];
    const offert = !!(ov && PLANS[ov.plan]);
    const parts = String(st.name || "").trim().split(" ");
    return {
      email,
      firstName: parts[0] || "",
      lastName: parts.slice(1).join(" "),
      plan: offert ? ov.plan : (st.plan || null),
      stripePlan: st.plan || null,
      offert,
      since: st.since || (ov && ov.at) || 0,
    };
  }).filter(r => r.plan && PLANS[r.plan]);
}

// Enregistre sur le serveur un accès offert (plan) ou le retire (plan null)
async function setAccess(email, plan){
  const tok = adminToken();
  if (!tok){ toast("Saisissez le jeton administrateur dans Abonnements", true); return false; }
  try {
    const r = await fetch("/.netlify/functions/abo", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": tok },
      body: JSON.stringify({ email: emailOf(email), plan: plan || null }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Erreur");
    accesCache = d.acces || {};
    try { sessionStorage.setItem("karat_acces", JSON.stringify(accesCache)); } catch (e) {}
    toast(plan && PLANS[plan] ? "Accès offert : " + PLANS[plan].name : "Accès offert retiré");
    logEvent(plan ? "accès offert" : "accès retiré", email, plan && PLANS[plan] ? PLANS[plan].name : "");
    render();
    return true;
  } catch (e) {
    toast(e.message === "Jeton administrateur invalide" ? e.message : "Enregistrement impossible : " + e.message, true);
    return false;
  }
}

document.addEventListener("click", e => {
  if (e.target.matches && e.target.matches("[data-veil]")) return closeModal();
  if (e.target.closest && e.target.closest(".side a")) document.querySelector(".shell")?.classList.remove("menu-open");
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn){ e.preventDefault(); fn(el); }
});

document.addEventListener("submit", e => {
  const f = e.target;
  const handlers = { loginForm: onLogin, signupForm: onSignup, composer: () => sendMessage(), editUserForm: onEditUser };
  if (handlers[f.id]){ e.preventDefault(); handlers[f.id](f); }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fileInput"){ importFiles(el.files); el.value = ""; return; }
  if (el.dataset.ack !== undefined){ updateAckState(); return; }
  if (el.dataset.change === "plan-select"){ setAccess(el.dataset.email, el.value || null); return; }
  if (el.dataset.change === "admin-filter"){ ui.adminFilter = el.value; ui.page = 1; fillAdminUsers(); return; }
  if (el.dataset.change === "log-filter"){ ui.logFilter = el.value; render(); }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.input === "admin-search"){ ui.adminQ = el.value; ui.page = 1; return fillAdminUsers(); }
  if (el.dataset.input === "sub-search") return fillSubs();
  if (el.dataset.input === "ok-field") return updateAckState();
  if (el.dataset.input === "filter-list"){
    const q = el.value.trim().toLowerCase();
    const sel = el.dataset.target === "conv" ? ".conv" : ".file";
    $$(sel).forEach(row => row.classList.toggle("hidden", !!q && !(row.dataset.s || "").includes(q)));
  }
  if (el.id === "input"){ el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 160) + "px"; }
});

document.addEventListener("keydown", e => {
  if (e.target.matches && e.target.matches("[data-enter]") && e.key === "Enter" && !e.shiftKey){
    e.preventDefault(); sendMessage();
  }
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".file[role=button], #drop")){
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("[data-drop]"); if (d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest && e.target.closest("[data-drop]");
  if (!d) return;
  e.preventDefault(); d.classList.remove("over");
  importFiles(e.dataTransfer.files);
});

/* Glisser un fichier dans le chat : overlay « Ajouter », fichier joint au prochain message */
let dragDepth = 0;
const onChatRoute = () => !!session && currentRoute().path === "/app/chat";
function chatVeil(show){
  const old = $("#dropVeil");
  if (!show){ if (old) old.remove(); return; }
  if (old) return;
  const v = document.createElement("div");
  v.id = "dropVeil"; v.className = "dropveil";
  v.innerHTML = `<div class="dropveil-card"><div class="dropveil-ico">${svg("upload")}</div><b>Ajouter</b><p>Pour ajouter un fichier à la conversation, déposez-le ici</p></div>`;
  document.body.appendChild(v);
}
document.addEventListener("dragenter", e => {
  if (!onChatRoute() || !e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
  e.preventDefault(); dragDepth++; chatVeil(true);
});
document.addEventListener("dragover", e => {
  if ($("#dropVeil") && !(e.target.closest && e.target.closest("[data-drop]"))) e.preventDefault();
});
document.addEventListener("dragleave", () => {
  if (!$("#dropVeil")) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) chatVeil(false);
});
document.addEventListener("drop", async e => {
  if (!$("#dropVeil") || (e.target.closest && e.target.closest("[data-drop]"))) return;
  e.preventDefault(); dragDepth = 0; chatVeil(false);
  await handleChatFiles(e.dataTransfer.files);
});

function avisSummary(){
  if (!avisState.count) return `<span class="muted">Pas encore d'avis</span>`;

  return `<article class="avis-card">

function avisRail(){
  if (!avisState.count) return `<div class="avis-rail avis-empty"><article class="avis-card avis-card-cta">
      <b>Soyez le premier à laisser un avis.</b>
      <p class="muted small">Votre retour aide les prochains utilisateurs à décider.</p>
    </article></div>`;
  const real = avisState.avis;

  if (real.length < 4) return `<div class="avis-rail avis-static" aria-label="Avis des utilisateurs">${real.map(avisCard).join("")}</div>`;
  // Défilement continu : la série est répétée, la copie est masquée aux lecteurs d'écran
  const half = real.map(avisCard).join("");
  const dur = Math.max(24, real.length * 6);
  return `<div class="avis-rail avis-loop" aria-label="Avis des utilisateurs"><div class="avis-track" style="animation-duration:${dur}s"><div class="avis-set">${half}</div><div class="avis-set" aria-hidden="true">${half}</div></div></div>`;

// Lecture de la liste (publique) puis mise à jour de l'écran
async function fetchAvis(){
  try {
    const r = await fetch(CONFIG.AVIS_ENDPOINT, { cache: "no-store" });
    if (!r.ok) return false;
    const d = await r.json();
    avisState.count = d.count || 0;
    avisState.average = d.average;
    avisState.avis = Array.isArray(d.avis) ? d.avis : [];
  } catch (e) { return false; }
  paintAvis();
  return true;
}
// Ne redessine la liste que si elle a changé, pour que le défilement ne saute pas
function paintAvis(force){
  const sig = avisSignature();
  if (!force && sig === avisUI.sig) return;
  avisUI.sig = sig;
  const block = $("#avis-block"); if (block) block.innerHTML = avisRail();
  const sum = $("#avis-summary"); if (sum) sum.innerHTML = avisSummary();
}
function startAvis(){
  fetchAvis();

  avisUI.timer = setInterval(() => {
    if (currentRoute().path !== "/") return clearInterval(avisUI.timer);

}
